name: DevSecOps - FastOrder

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r requirements-dev.txt

      - name: Executar Flake8
        run: flake8 app.py tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar Pytest
        run: python -m pytest -v

  security-scans:
    name: Secret Scanning, SAST e SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning com TruffleHog
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          version: "3.99.8"
          extra_args: --results=verified,unknown

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ferramentas de segurança
        run: python -m pip install -r requirements-dev.txt

      - name: SAST com Bandit
        run: bandit -r app.py 

      - name: SCA com pip-audit
        run: pip-audit -r requirements.txt

  build-and-push:
    name: Build, Trivy e publicação no GHCR
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scans]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar nome da imagem
        id: image
        shell: bash
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$repository" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem para análise
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Escanear imagem com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          # Os achados HIGH do scan local não tinham versão corrigida; CRITICAL segue bloqueante.
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          scanners: vuln

      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem verificada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker tag "${{ steps.image.outputs.name }}:${{ github.sha }}" "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.name }}:latest"
