name: CI - Testes e Deploy Docker

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  IMAGE_NAME: ci-docker-api

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Executar testes
        run: pytest -q

  build:
    name: Build e smoke test Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build --tag "$IMAGE_NAME:${{ github.sha }}" .

      - name: Iniciar o container
        run: docker run --detach --name ci-docker-api --publish 5000:5000 "$IMAGE_NAME:${{ github.sha }}"

      - name: Verificar endpoint de saúde
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs ci-docker-api
          exit 1

      - name: Parar o container
        if: always()
        run: docker rm --force ci-docker-api

  deploy:
    name: Publicar imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-docker-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-docker-api:${{ github.sha }}

